name: Refresh data and deploy dashboard

on:
  schedule:
    # 10:15 UTC = 6:15 AM EDT / 5:15 AM EST, Mon-Sat (no street cleaning on Sundays)
    - cron: "15 10 * * 1-6"
  push:
    branches: [main]
    paths: ["site/**", "asp.py", "data/asp_suspensions_*.csv", ".github/workflows/digest.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh sign data
        run: python asp.py fetch || echo "::warning::fetch failed; using committed data"

      - name: Build dashboard data and text digest
        run: |
          python asp.py export
          python asp.py digest --out TODAY.md

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODAY.md data/street_cleaning.csv site/data.json
          git diff --cached --quiet || git commit -m "Data refresh for $(TZ=America/New_York date +%F)"
          git push

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
